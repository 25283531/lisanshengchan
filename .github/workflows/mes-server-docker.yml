# 注塑生产协同 MES · 服务端 / 求解器镜像构建
#
# 说明：MES 位于本仓库的 molding-mes/ 子目录，而 GitHub 只识别「仓库根」的
# .github/workflows，因此本文件放在仓库根，构建上下文指向 ./molding-mes。
#
# 产出：
#   ghcr.io/<owner>/<repo>-mes-server:<tag>     服务端（含管理后台静态页）
#   ghcr.io/<owner>/<repo>-mes-optimizer:<tag>  CP-SAT 排产求解器（Python/OR-Tools）
# 打 v*.*.* 标签或手动触发即构建；PR 只做构建校验不推送。

name: MES Server Docker

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签（留空用当前分支/标签名）'
        required: false
        default: ''
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    paths:
      - 'molding-mes/server/**'
      - 'molding-mes/optimizer/**'
      - '.github/workflows/mes-server-docker.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: mes-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve tag
        id: tag
        run: |
          INPUT="${{ github.event.inputs.tag }}"
          TAG="${INPUT:-${GITHUB_REF_NAME}}"
          TAG="${TAG:-latest}"
          # 分支名可能含 / 等非法字符，统一替换
          TAG=$(echo "$TAG" | tr '/' '-')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "repo=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./molding-mes
          file: ./molding-mes/server/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          cache-from: type=gha,scope=mes-server
          cache-to: type=gha,mode=max,scope=mes-server
          tags: |
            ghcr.io/${{ steps.tag.outputs.owner }}/${{ steps.tag.outputs.repo }}-mes-server:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ steps.tag.outputs.owner }}/${{ steps.tag.outputs.repo }}-mes-server:latest
          build-args: |
            BUILT_AT=${{ github.run_id }}

      - name: Smoke test (health endpoint)
        if: github.event_name == 'pull_request'
        run: |
          docker run -d --name mes-smoke -p 8080:8080 \
            $(docker images --format '{{.Repository}}:{{.Tag}}' | grep mes-server | head -1)
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health > /dev/null; then
              echo "健康检查通过"; docker rm -f mes-smoke; exit 0
            fi
            sleep 2
          done
          docker logs mes-smoke || true
          docker rm -f mes-smoke
          echo "健康检查失败" && exit 1

  optimizer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve tag
        id: tag
        run: |
          INPUT="${{ github.event.inputs.tag }}"
          TAG="${INPUT:-${GITHUB_REF_NAME}}"
          TAG="${TAG:-latest}"
          TAG=$(echo "$TAG" | tr '/' '-')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "repo=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push optimizer image
        uses: docker/build-push-action@v6
        with:
          context: ./molding-mes/optimizer
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=mes-optimizer
          cache-to: type=gha,mode=max,scope=mes-optimizer
          tags: |
            ghcr.io/${{ steps.tag.outputs.owner }}/${{ steps.tag.outputs.repo }}-mes-optimizer:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ steps.tag.outputs.owner }}/${{ steps.tag.outputs.repo }}-mes-optimizer:latest

      - name: Summary
        run: |
          {
            echo "### 服务端镜像构建完成"
            echo ""
            echo "- 事件：${{ github.event_name }}"
            echo "- 标签：${{ steps.tag.outputs.tag }}"
            echo "- 镜像：ghcr.io/${{ steps.tag.outputs.owner }}/${{ steps.tag.outputs.repo }}-mes-server:${{ steps.tag.outputs.tag }}"
            echo "- 求解器：ghcr.io/${{ steps.tag.outputs.owner }}/${{ steps.tag.outputs.repo }}-mes-optimizer:${{ steps.tag.outputs.tag }}"
          } >> "$GITHUB_STEP_SUMMARY"
