services:
  web:
    build: ./apps/web
    ports: ["${WEB_PORT:-8080}:80"]
    depends_on: [api]
    restart: unless-stopped
  api:
    build: ./apps/api
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-mes}
      DB_USER: ${POSTGRES_USER:-mes}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      OPTIMIZER_URL: ${OPTIMIZER_URL:-http://optimizer:8000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      optimizer: { condition: service_started }
    restart: unless-stopped
  optimizer:
    build: ./apps/scheduler
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mes}
      POSTGRES_USER: ${POSTGRES_USER:-mes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    volumes: [redis_data:/data]
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:

