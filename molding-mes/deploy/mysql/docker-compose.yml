# 生产编排：MySQL 8 + 服务端 + 排产求解器
#
# 数据全部落在宿主机 /data/mes/ 下（数据盘），Docker 引擎与镜像留在 /opt/docker（系统盘）：
#   /data/mes/mysql   数据库文件（容器内 uid 999:mysql，宿主机需 chown 999:999）
#   /data/mes/data    服务端上传/导出等运行数据
#   /data/mes/backup  备份（mysqldump 产出）
#
# 用法：
#   mkdir -p /data/mes/{mysql,data,backup}
#   chown -R 999:999 /data/mes/mysql
#   docker compose -f docker-compose.yml up -d
#   管理后台：http://<host>:8080/admin/
services:
  mysql:
    image: mysql:8.0
    container_name: mes-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在同目录 .env 里设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: molding_mes
      MYSQL_USER: mes
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在同目录 .env 里设置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 时间字段一律按东八区本地口径存取，务必与 TZ 一致
      - --default-time-zone=+08:00
      # 小内存设备（软路由/工控机）按实际内存调整，一般给总内存的 10%~20%
      - --innodb-buffer-pool-size=256M
      - --max-connections=100
      - --slow-query-log=0
    volumes:
      - /data/mes/mysql:/var/lib/mysql
    networks:
      - mes-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    logging: &log
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  server:
    image: ghcr.io/25283531/lisanshengchan-mes-server:v3.7.1
    container_name: mes-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      optimizer:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      PORT: 8080
      HOST: 0.0.0.0
      # 生产务必改成随机长字符串（放同目录 .env，不要提交到仓库）
      JWT_SECRET: ${JWT_SECRET:?请在同目录 .env 里设置 JWT_SECRET}
      PLATFORM_TOKEN: ${PLATFORM_TOKEN:?请在同目录 .env 里设置 PLATFORM_TOKEN}
      DB_DIALECT: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: mes
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: molding_mes
      DB_POOL: 10
      # 日志级别：info（默认，后台「运行日志」页与 docker logs 都看得到请求与关键动作）
      # 嫌请求日志太吵就改 warn；排障时可临时改 debug。改完 docker compose up -d 生效
      LOG_LEVEL: info
      OPTIMIZER_ENABLED: "true"
      OPTIMIZER_URL: http://mes-optimizer:8090
      SERVE_ADMIN_WEB: "true"
    ports:
      - "8080:8080"
    volumes:
      - /data/mes/data:/data
    networks:
      - mes-net
    logging: *log

  optimizer:
    image: ghcr.io/25283531/lisanshengchan-mes-optimizer:v3.7.1
    container_name: mes-optimizer
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    networks:
      - mes-net
    logging: *log

networks:
  mes-net:
    driver: bridge
