<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注塑生产协同 MES · 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ 登录 ============ -->
<div id="login" class="login-wrap">
  <div class="login-card">
    <h1>注塑生产协同 MES</h1>
    <p class="sub">管理后台 · 公司注册与授权 · 基础数据 · AI 接口配置</p>

    <div class="tabs">
      <button class="tab active" data-tab="company">公司管理员</button>
      <button class="tab" data-tab="platform">平台运维</button>
    </div>

    <div id="pane-company" class="pane">
      <label>公司编码（也可填公司名称）<input id="lg-code" placeholder="DEMO" value="DEMO"></label>
      <label>手机号<input id="lg-phone" placeholder="13800000001" value="13800000001"></label>
      <label>密码<input id="lg-pwd" type="password" placeholder="123456" value="123456"></label>
      <button class="primary" id="btn-login">登录</button>
      <p class="hint">演示账号：13800000001（管理员）/ 13800000002（业务员）… 密码统一 123456。
        公司编码在平台后台「公司注册与授权」列表里查看；公司<strong>第一个管理员</strong>（平台注册时登记的手机号）
        无需先授权，用初始密码即可直接登录。</p>
    </div>

    <div id="pane-platform" class="pane hidden">
      <label>平台口令<input id="pf-token" type="password" placeholder="platform-admin-token" value="platform-admin-token"></label>
      <button class="primary" id="btn-platform-login">进入平台</button>
      <p class="hint">平台侧负责：注册公司、设置用户数与授权期限、停用服务</p>
    </div>
    <div id="login-err" class="err"></div>
  </div>
</div>

<!-- ============ 主体 ============ -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand">注塑生产协同 MES <span class="ver">管理后台</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="who">
      <span id="who-name"></span>
      <button class="ghost" id="btn-logout">退出</button>
    </div>
  </header>
  <main id="main"></main>
</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
